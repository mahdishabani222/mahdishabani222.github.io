<meta charset="UTF-8">
<script>
  (function(){
    try{
      var saved = localStorage.getItem('site-theme');
      if(saved === 'dark' || saved === 'light'){
        document.documentElement.setAttribute('data-theme', saved);
      }
    }catch(e){}
  })();
</script>

<style>
/* =========================================================
   Mahdi Shabani — Personal Site
   Design language: Apple-inspired minimal luxury
   Single grayscale palette, one typeface, generous space
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@400;500;600&display=swap');

:root{
  /* color — restrained, monochrome */
  --bg:        #FBFBFD;
  --surface:   #FFFFFF;
  --ink:       #1D1D1F;
  --secondary: #86868B;
  --hairline:  #D2D2D7;
  --fill:      #F5F5F7;
  --shadow:       0 1px 2px rgba(0,0,0,.02), 0 10px 28px -16px rgba(0,0,0,.10);
  --shadow-hover: 0 1px 2px rgba(0,0,0,.03), 0 22px 44px -18px rgba(0,0,0,.14);

  /* type — one family, hierarchy through weight & size */
  --font-display: 'Inter', 'Vazirmatn', -apple-system, sans-serif;
  --font-body:    'Inter', 'Vazirmatn', -apple-system, sans-serif;
  --font-fa:      'B Nazanin', 'Vazirmatn', Tahoma, sans-serif;

  --ease: cubic-bezier(.16,1,.3,1);

  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

[data-theme="dark"]{
  --bg:        #000000;
  --surface:   #1C1C1E;
  --ink:       #F5F5F7;
  --secondary: #98989D;
  --hairline:  #38383A;
  --fill:      #2C2C2E;
  --shadow:       0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.5);
  --shadow-hover: 0 1px 2px rgba(0,0,0,.35), 0 22px 44px -18px rgba(0,0,0,.6);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }

body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  transition: background .5s var(--ease), color .5s var(--ease);
}

.fa{ font-family: var(--font-fa); direction: rtl; }

.wrap{
  max-width: 900px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ---------- header ---------- */
.site-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 36px 0 8px;
}

.mark{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: -.01em;
  color: var(--ink);
  text-decoration: none;
}

.theme-toggle{
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--fill);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink);
  transition: background .3s var(--ease), transform .3s var(--ease);
}
.theme-toggle:hover{ transform: scale(1.06); }
.theme-toggle svg{ width: 16px; height: 16px; }
.theme-toggle .moon{ display: none; }
[data-theme="dark"] .theme-toggle .sun{ display: none; }
[data-theme="dark"] .theme-toggle .moon{ display: block; }

/* ---------- hero ---------- */
.hero{
  padding: 96px 0 56px;
  text-align: center;
}

.eyebrow{
  font-size: .8rem;
  font-weight: 500;
  letter-spacing: .01em;
  color: var(--secondary);
  margin: 0 0 18px;
}

.hero h1{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.75rem, 6vw, 4.2rem);
  letter-spacing: -.03em;
  line-height: 1.05;
  margin: 0 0 20px;
  color: var(--ink);
}

.hero p.tagline{
  color: var(--secondary);
  font-size: 1.15rem;
  font-weight: 400;
  max-width: 560px;
  line-height: 1.55;
  margin: 0 auto 36px;
}

.cv-btn{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 28px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  text-decoration: none;
  font-size: .92rem;
  font-weight: 500;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.cv-btn:hover{ opacity: .82; transform: translateY(-1px); }
.cv-btn svg{ width: 15px; height: 15px; }

/* ---------- box grid ---------- */
.grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding: 24px 0 88px;
}

@media (max-width: 860px){
  .grid{ grid-template-columns: 1fr; }
}

.box{
  position: relative;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow);
  padding: 36px 30px;
  overflow: hidden;
  transition: box-shadow .45s var(--ease), transform .45s var(--ease), border-color .45s var(--ease);
}

.box:hover{
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}

.box h2{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.1rem;
  letter-spacing: -.01em;
  margin: 0 0 22px;
  color: var(--ink);
}

/* profile box */
.profile-box{ display: flex; flex-direction: column; align-items: center; text-align: center; }

.avatar-ring{
  width: 116px;
  height: 116px;
  border-radius: 50%;
  padding: 3px;
  border: 1px solid var(--hairline);
  margin-bottom: 22px;
}
.avatar-ring img{
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

.profile-box .name{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.3rem;
  letter-spacing: -.01em;
  margin: 0 0 4px;
  color: var(--ink);
}
.profile-box .role{
  color: var(--secondary);
  font-size: .88rem;
  margin: 0 0 24px;
}

.icon-row{
  display: flex;
  gap: 12px;
}

.icon-link{
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  text-decoration: none;
  transition: background .3s var(--ease), transform .3s var(--ease);
}
.icon-link:hover{
  transform: translateY(-2px);
  background: var(--fill);
}
.icon-link svg{ width: 18px; height: 18px; }

/* list boxes (projects / research) */
.item-list{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.item-list li{ border-top: 1px solid var(--hairline); }
.item-list li:first-child{ border-top: none; }

.item-list a{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 2px;
  color: var(--ink);
  text-decoration: none;
  font-size: .96rem;
  font-weight: 400;
  line-height: 1.45;
  transition: color .3s var(--ease), gap .3s var(--ease);
}
.item-list a:hover{ color: var(--secondary); gap: 18px; }
.item-list a .arrow{ flex: none; width: 14px; height: 14px; opacity: .45; transition: transform .35s var(--ease), opacity .35s var(--ease); }
.item-list a:hover .arrow{ transform: translateX(-3px); opacity: .9; }
.item-list a:hover .arrow.rtl{ transform: translateX(3px); }

.item-list .fa-item{ font-family: var(--font-fa); direction: rtl; text-align: right; font-size: 1.02rem; }

.more-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 20px;
  font-size: .8rem;
  font-weight: 500;
  color: var(--secondary);
  text-decoration: none;
  transition: color .3s var(--ease);
}
.more-link:hover{ color: var(--ink); }
.more-link svg{ width: 13px; height: 13px; }

/* ---------- footer ---------- */
.site-footer{
  text-align: center;
  padding: 36px 0 60px;
  color: var(--secondary);
  font-size: .82rem;
  border-top: 1px solid var(--hairline);
}

/* ---------- inner pages (projects/research) ---------- */
.page-header{ padding: 76px 0 24px; }
.back-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--secondary);
  text-decoration: none;
  font-size: .86rem;
  margin-bottom: 30px;
  transition: color .3s var(--ease);
}
.back-link:hover{ color: var(--ink); }
.back-link svg{ width: 13px; height: 13px; }

.page-header h1{
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -.02em;
  font-size: clamp(2.1rem, 4.5vw, 2.8rem);
  margin: 0 0 12px;
  color: var(--ink);
}
.page-header p{ color: var(--secondary); margin: 0 0 44px; font-size: 1.02rem; }

.entry-list{ display: flex; flex-direction: column; gap: 16px; padding-bottom: 90px; }

.entry{
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 28px 30px;
  box-shadow: var(--shadow);
  transition: box-shadow .4s var(--ease), transform .4s var(--ease);
}
.entry:hover{ transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.entry h3{
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: -.01em;
  margin: 0 0 10px;
  color: var(--ink);
}
.entry h3.fa{ text-align: right; }
.entry .status{
  display: inline-block;
  font-size: .72rem;
  font-weight: 500;
  color: var(--secondary);
  background: var(--fill);
  border-radius: 999px;
  padding: 4px 13px;
  margin-bottom: 14px;
}
.entry p.desc{ color: var(--secondary); margin: 0; line-height: 1.65; font-size: .95rem; }
.entry p.desc.fa{ text-align: right; }

/* ---------- scroll reveal ---------- */
.reveal{
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .8s var(--ease), transform .8s var(--ease);
}
.reveal.is-visible{
  opacity: 1;
  transform: translateY(0);
}

/* ---------- extra sections (skills / timeline / contact) ---------- */
.section{
  padding: 12px 0 72px;
}
.section-head{
  text-align: center;
  margin-bottom: 36px;
}
.section-head h2{
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -.02em;
  font-size: 1.7rem;
  margin: 0 0 8px;
  color: var(--ink);
}
.section-head p{
  color: var(--secondary);
  font-size: .95rem;
  margin: 0;
}

/* skills */
.skills-row{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.skill-chip{
  display: inline-flex;
  align-items: center;
  font-size: .86rem;
  font-weight: 400;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink);
  transition: background .3s var(--ease);
}
.skill-chip:hover{ background: var(--fill); }
.skill-chip .dot{ display: none; }

/* timeline */
.timeline{
  position: relative;
  max-width: 620px;
  margin: 0 auto;
  padding-left: 26px;
  border-left: 1px solid var(--hairline);
}
.timeline-item{
  position: relative;
  padding-bottom: 38px;
}
.timeline-item:last-child{ padding-bottom: 0; }
.timeline-item::before{
  content: "";
  position: absolute;
  left: -31px;
  top: 5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink);
}
.timeline-item .t-period{
  font-size: .76rem;
  font-weight: 500;
  color: var(--secondary);
  margin: 0 0 5px;
}
.timeline-item h3{
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -.01em;
  margin: 0 0 5px;
  color: var(--ink);
}
.timeline-item p{
  color: var(--secondary);
  font-size: .9rem;
  margin: 0;
  line-height: 1.55;
}

/* contact form */
.contact-box{
  max-width: 540px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 36px 34px;
}
.form-row{ margin-bottom: 16px; }
.form-row label{
  display: block;
  font-size: .8rem;
  font-weight: 500;
  color: var(--secondary);
  margin-bottom: 7px;
}
.form-row input,
.form-row textarea{
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--fill);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: .92rem;
  resize: vertical;
  transition: background .25s var(--ease), box-shadow .25s var(--ease);
}
.form-row input:focus,
.form-row textarea:focus{
  outline: none;
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--ink);
}
.form-submit{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 28px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  border: none;
  font-size: .9rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.form-submit:hover{ opacity: .82; transform: translateY(-1px); }
.form-note{
  font-size: .78rem;
  color: var(--secondary);
  margin-top: 14px;
  text-align: center;
  line-height: 1.6;
}

@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="wrap">

  <header class="site-header">
    <a href="index.html" class="mark">M. Shabani</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div class="page-header">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      Back home
    </a>
    <h1>Ongoing Projects</h1>
    <p>A working list of what I'm currently building and researching.</p>
  </div>

  <main class="entry-list" id="entry-list"></main>

  <footer class="site-footer">
    © <span id="year"></span> <span id="footer-name">Mahdi Shabani</span>. All rights reserved.
  </footer>

</div>

<script>
const FALLBACK_CONTENT = {
  "profile": { "name": "Mahdi Shabani" },
  "projects": [
    {"title":"Development of an Explainable and Uncertainty-Aware Machine Learning Framework for Spatial Decision-Making","status":"In progress","description":"Details coming soon."},
    {"title":"MPM Using Machine Learning Algorithms","status":"In progress","description":"Details coming soon."}
  ]
};

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

async function loadContent(){
  try{
    const res = await fetch('content.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('bad response');
    return await res.json();
  }catch(e){
    console.warn('Could not load content.json, using fallback content.', e);
    return FALLBACK_CONTENT;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const data = await loadContent();
  document.getElementById('footer-name').textContent = (data.profile && data.profile.name) || '';
  document.getElementById('year').textContent = new Date().getFullYear();

  const list = document.getElementById('entry-list');
  (data.projects || []).forEach((proj, i) => {
    const art = document.createElement('article');
    art.className = 'entry reveal';
    art.id = 'project-' + (i + 1);
    art.style.transitionDelay = (i * 0.08).toFixed(2) + 's';
    art.innerHTML = `
      <span class="status">${escapeHtml(proj.status || '')}</span>
      <h3>${escapeHtml(proj.title)}</h3>
      <p class="desc">${escapeHtml(proj.description || '')}</p>`;
    list.appendChild(art);
  });

  // (re)initialize scroll reveal for the elements we just added
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
  }
});
</script>
<script>
// Simple light/dark theme toggle (in-memory, resets on reload by design)
document.addEventListener('DOMContentLoaded', () => {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;

  btn.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('site-theme', next); }catch(e){}
  });
});

</script>
</body>
