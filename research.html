</script>

<style>
/* =========================================================
   Mahdi Shabani — Personal Site
   Design language: calm luxury — misty cool neutrals
   + warm gold/bronze accent, serif display type
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@300;400;500;600&family=Vazirmatn:wght@400;500;600&display=swap');

:root{
  /* color — misty cool neutral base + warm gold accent */
  --bg:        #F4F6F8;
  --surface:   #FFFFFF;
  --ink:       #2A3138;
  --secondary: #7C8791;
  --hairline:  #DEE4E9;
  --fill:      #ECF0F3;

  --gold:       #B08A4E;
  --gold-deep:  #8F6C36;
  --gold-tint:  #F1E6D2;

  --shadow:       0 1px 2px rgba(42,49,56,.03), 0 14px 34px -18px rgba(42,49,56,.12);
  --shadow-hover: 0 1px 2px rgba(42,49,56,.04), 0 26px 50px -20px rgba(42,49,56,.16);

  /* type — serif for calm elegance, sans for clarity */
  --font-display: 'Fraunces', 'Vazirmatn', Georgia, serif;
  --font-body:    'Inter', 'Vazirmatn', -apple-system, sans-serif;
  --font-fa:      'B Nazanin', 'Vazirmatn', Tahoma, sans-serif;

  --ease: cubic-bezier(.22,.61,.36,1);

  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 13px;
}

[data-theme="dark"]{
  --bg:        #12161B;
  --surface:   #1B2027;
  --ink:       #EDEFF2;
  --secondary: #98A2AB;
  --hairline:  #2A3038;
  --fill:      #232933;

  --gold:       #D4B073;
  --gold-deep:  #E6C88E;
  --gold-tint:  #3A3122;

  --shadow:       0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.5);
  --shadow-hover: 0 1px 2px rgba(0,0,0,.35), 0 26px 50px -20px rgba(0,0,0,.6);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }

body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  transition: background .6s var(--ease), color .6s var(--ease);
}

.fa{ font-family: var(--font-fa); direction: rtl; }

.wrap{
  max-width: 900px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ---------- header ---------- */
.site-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 38px 0 8px;
}

.mark{
  font-family: var(--font-display);
  font-weight: 500;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--ink);
  text-decoration: none;
}

.theme-toggle{
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--fill);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink);
  transition: background .35s var(--ease), transform .35s var(--ease);
}
.theme-toggle:hover{ transform: scale(1.06); background: var(--gold-tint); }
.theme-toggle svg{ width: 16px; height: 16px; }
.theme-toggle .moon{ display: none; }
[data-theme="dark"] .theme-toggle .sun{ display: none; }
[data-theme="dark"] .theme-toggle .moon{ display: block; }

/* ---------- hero ---------- */
.hero{
  padding: 100px 0 58px;
  text-align: center;
}

.eyebrow{
  font-size: .78rem;
  font-weight: 500;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin: 0 0 20px;
}

.hero h1{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(2.75rem, 6vw, 4.4rem);
  letter-spacing: -.01em;
  line-height: 1.1;
  margin: 0 0 22px;
  color: var(--ink);
}

.hero p.tagline{
  color: var(--secondary);
  font-size: 1.15rem;
  font-weight: 400;
  max-width: 580px;
  line-height: 1.65;
  margin: 0 auto 38px;
}

.cv-btn{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 30px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  color: #FFFDF8;
  text-decoration: none;
  font-size: .92rem;
  font-weight: 500;
  box-shadow: 0 10px 26px -12px rgba(176,138,78,.45);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.cv-btn:hover{ transform: translateY(-2px); box-shadow: 0 16px 34px -14px rgba(176,138,78,.55); }
.cv-btn svg{ width: 15px; height: 15px; }

/* ---------- box grid ---------- */
.grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 26px 0 90px;
}

@media (max-width: 860px){
  .grid{ grid-template-columns: 1fr; }
}

.box{
  position: relative;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow);
  padding: 38px 30px;
  overflow: hidden;
  transition: box-shadow .5s var(--ease), transform .5s var(--ease), border-color .5s var(--ease);
}

.box:hover{
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: var(--gold-tint);
}

.box h2{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.25rem;
  margin: 0 0 24px;
  color: var(--ink);
}

/* profile box */
.profile-box{ display: flex; flex-direction: column; align-items: center; text-align: center; }

.avatar-ring{
  width: 120px;
  height: 120px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--gold-tint), var(--hairline));
  margin-bottom: 24px;
}
.avatar-ring img{
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 3px solid var(--surface);
}

.profile-box .name{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.4rem;
  margin: 0 0 4px;
  color: var(--ink);
}
.profile-box .role{
  color: var(--secondary);
  font-size: .88rem;
  margin: 0 0 26px;
}

.icon-row{
  display: flex;
  gap: 12px;
}

.icon-link{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  text-decoration: none;
  transition: background .35s var(--ease), transform .35s var(--ease), border-color .35s var(--ease);
}
.icon-link:hover{
  transform: translateY(-2px);
  background: var(--gold-tint);
  border-color: var(--gold);
}
.icon-link svg{ width: 18px; height: 18px; }

/* list boxes (projects / research) */
.item-list{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.item-list li{ border-top: 1px solid var(--hairline); }
.item-list li:first-child{ border-top: none; }

.item-list a{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 2px;
  color: var(--ink);
  text-decoration: none;
  font-size: .96rem;
  font-weight: 400;
  line-height: 1.5;
  transition: color .35s var(--ease), gap .35s var(--ease);
}
.item-list a:hover{ color: var(--gold-deep); gap: 18px; }
.item-list a .arrow{ flex: none; width: 14px; height: 14px; opacity: .45; transition: transform .4s var(--ease), opacity .4s var(--ease); }
.item-list a:hover .arrow{ transform: translateX(-3px); opacity: .9; }
.item-list a:hover .arrow.rtl{ transform: translateX(3px); }

.item-list .fa-item{ font-family: var(--font-fa); direction: rtl; text-align: right; font-size: 1.02rem; }

.more-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 22px;
  font-size: .8rem;
  font-weight: 500;
  color: var(--secondary);
  text-decoration: none;
  transition: color .35s var(--ease);
}
.more-link:hover{ color: var(--gold-deep); }
.more-link svg{ width: 13px; height: 13px; }

/* ---------- footer ---------- */
.site-footer{
  text-align: center;
  padding: 38px 0 64px;
  color: var(--secondary);
  font-size: .82rem;
  border-top: 1px solid var(--hairline);
}

/* ---------- inner pages (projects/research) ---------- */
.page-header{ padding: 80px 0 26px; }
.back-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--secondary);
  text-decoration: none;
  font-size: .86rem;
  margin-bottom: 32px;
  transition: color .35s var(--ease);
}
.back-link:hover{ color: var(--gold-deep); }
.back-link svg{ width: 13px; height: 13px; }

.page-header h1{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(2.2rem, 4.5vw, 2.9rem);
  margin: 0 0 12px;
  color: var(--ink);
}
.page-header p{ color: var(--secondary); margin: 0 0 46px; font-size: 1.02rem; }

.entry-list{ display: flex; flex-direction: column; gap: 18px; padding-bottom: 94px; }

.entry{
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 30px 32px;
  box-shadow: var(--shadow);
  transition: box-shadow .45s var(--ease), transform .45s var(--ease), border-color .45s var(--ease);
}
.entry:hover{ transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--gold-tint); }
.entry h3{
  font-family: var(--font-display);
  font-size: 1.28rem;
  font-weight: 500;
  margin: 0 0 10px;
  color: var(--ink);
}
.entry h3.fa{ text-align: right; }
.entry .status{
  display: inline-block;
  font-size: .72rem;
  font-weight: 500;
  color: var(--gold-deep);
  background: var(--gold-tint);
  border-radius: 999px;
  padding: 4px 13px;
  margin-bottom: 14px;
}
.entry p.desc{ color: var(--secondary); margin: 0; line-height: 1.7; font-size: .95rem; }
.entry p.desc.fa{ text-align: right; }

/* ---------- scroll reveal ---------- */
.reveal{
  opacity: 0;
  transform: translateY(16px);
  transition: opacity .9s var(--ease), transform .9s var(--ease);
}
.reveal.is-visible{
  opacity: 1;
  transform: translateY(0);
}

/* ---------- extra sections (skills / timeline / contact) ---------- */
.section{
  padding: 14px 0 76px;
}
.section-head{
  text-align: center;
  margin-bottom: 38px;
}
.section-head h2{
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.8rem;
  margin: 0 0 8px;
  color: var(--ink);
}
.section-head p{
  color: var(--secondary);
  font-size: .95rem;
  margin: 0;
}

/* badges & tag pills */
.badge-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.badge{
  display:inline-block;
  font-size:.72rem;
  font-weight:500;
  color: var(--gold-deep);
  background: var(--gold-tint);
  border-radius:999px;
  padding:4px 13px;
}
.badge.status-badge{ color: var(--gold-deep); background: var(--gold-tint); }
.badge.domain-badge{ color: var(--secondary); background: transparent; border:1px solid var(--hairline); }

.tech-tags{ display:flex; flex-wrap:wrap; gap:7px; margin: 14px 0; }
.tech-tag{
  font-size:.76rem;
  color: var(--secondary);
  border:1px solid var(--hairline);
  border-radius:999px;
  padding:4px 12px;
}

.impact-line{
  font-size:.89rem;
  color: var(--ink);
  border-left: 2px solid var(--gold);
  padding-left: 15px;
  margin-top: 18px;
  line-height: 1.65;
}
[dir="rtl"] .impact-line{ border-left:none; border-right:2px solid var(--gold); padding-left:0; padding-right:15px; }

.entry-sub{ color: var(--secondary); font-size: .96rem; margin: -4px 0 14px; }

/* about section */
.about-text{
  max-width: 640px;
  margin: 0 auto 28px;
  text-align: center;
  color: var(--secondary);
  font-size: 1.05rem;
  line-height: 1.75;
}
.about-text strong{ color: var(--ink); font-weight: 500; }

.approach-row{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom: 40px;
}
.approach-chip{
  font-size:.78rem; font-weight:500; color: var(--gold-deep);
  background: var(--gold-tint); border-radius:999px; padding:6px 15px;
}

.career-strip{
  display:flex; align-items:center; justify-content:center;
  flex-wrap: wrap;
  gap: 10px;
  max-width: 720px;
  margin: 0 auto;
  font-size: .88rem;
  color: var(--secondary);
}
.career-strip .stage{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding: 16px 20px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--surface);
  min-width: 170px;
}
.career-strip .stage .label{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color: var(--gold-deep); }
.career-strip .stage .value{ font-size:.86rem; color: var(--ink); font-weight:500; text-align:center; }
.career-strip .sep{ color: var(--hairline); font-size:1.2rem; }
@media (max-width: 640px){ .career-strip .sep{ display:none; } }

/* skill categories */
.skill-category{ margin-bottom: 28px; }
.skill-category:last-child{ margin-bottom: 0; }
.skill-category .cat-label{
  text-align:center;
  font-family: var(--font-display);
  font-style: italic;
  font-size:.95rem;
  font-weight:500;
  color: var(--gold-deep);
  margin: 0 0 14px;
}

/* skills */
.skills-row{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.skill-chip{
  display: inline-flex;
  align-items: center;
  font-size: .86rem;
  font-weight: 400;
  padding: 9px 19px;
  border-radius: 999px;
  border: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink);
  transition: background .35s var(--ease), border-color .35s var(--ease);
}
.skill-chip:hover{ background: var(--gold-tint); border-color: var(--gold); }
.skill-chip .dot{ display: none; }

/* timeline */
.timeline{
  position: relative;
  max-width: 620px;
  margin: 0 auto;
  padding-left: 28px;
  border-left: 1px solid var(--hairline);
}
.timeline-item{
  position: relative;
  padding-bottom: 40px;
}
.timeline-item:last-child{ padding-bottom: 0; }
.timeline-item::before{
  content: "";
  position: absolute;
  left: -33px;
  top: 5px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 4px var(--gold-tint);
}
.timeline-item .t-period{
  font-size: .76rem;
  font-weight: 500;
  color: var(--gold-deep);
  margin: 0 0 6px;
}
.timeline-item h3{
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 500;
  margin: 0 0 5px;
  color: var(--ink);
}
.timeline-item p{
  color: var(--secondary);
  font-size: .9rem;
  margin: 0;
  line-height: 1.6;
}

/* contact form */
.contact-box{
  max-width: 550px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 38px 36px;
}
.form-row{ margin-bottom: 17px; }
.form-row label{
  display: block;
  font-size: .8rem;
  font-weight: 500;
  color: var(--secondary);
  margin-bottom: 7px;
}
.form-row input,
.form-row textarea{
  width: 100%;
  padding: 12px 15px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--fill);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: .92rem;
  resize: vertical;
  transition: background .3s var(--ease), box-shadow .3s var(--ease);
}
.form-row input:focus,
.form-row textarea:focus{
  outline: none;
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--gold);
}
.form-submit{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 30px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  color: #FFFDF8;
  border: none;
  font-size: .9rem;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 10px 26px -12px rgba(176,138,78,.45);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.form-submit:hover{ transform: translateY(-2px); box-shadow: 0 16px 34px -14px rgba(176,138,78,.55); }
.form-note{
  font-size: .78rem;
  color: var(--secondary);
  margin-top: 15px;
  text-align: center;
  line-height: 1.6;
}

@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; animation: none !important; }
}
</style>

<div class="wrap">

  <header class="site-header">
    <a href="index.html" class="mark">M. Shabani</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div class="page-header">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      Back home
    </a>
    <h1>Research</h1>
    <p>Published and ongoing research work.</p>
  </div>

  <main class="entry-list" id="entry-list"></main>

  <footer class="site-footer">
    © <span id="year"></span> <span id="footer-name">Mahdi Shabani</span>. All rights reserved.
  </footer>

</div>

<script>
const FALLBACK_CONTENT = {
  "profile": { "name": "Mahdi Shabani" },
  "research": [
    {"title":"تشخیص نوع گوهرسنگ با استفاده از شبکه عصبی کانوولوشنی","status":"Article","lang":"fa","description":"چکیده مقاله را اینجا قرار دهید."}
  ]
};

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

async function loadContent(){
  try{
    const res = await fetch('content.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('bad response');
    return await res.json();
  }catch(e){
    console.warn('Could not load content.json, using fallback content.', e);
    return FALLBACK_CONTENT;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const data = await loadContent();
  document.getElementById('footer-name').textContent = (data.profile && data.profile.name) || '';
  document.getElementById('year').textContent = new Date().getFullYear();

  const list = document.getElementById('entry-list');
  (data.research || []).forEach((r, i) => {
    const isFa = r.lang === 'fa';
    const art = document.createElement('article');
    art.className = 'entry reveal';
    art.id = 'research-' + (i + 1);
    art.style.transitionDelay = (i * 0.08).toFixed(2) + 's';

    const domainHtml = r.domain ? `<span class="badge domain-badge">${escapeHtml(r.domain)}</span>` : '';
    const areasHtml = (r.researchAreas && r.researchAreas.length)
      ? `<div class="tech-tags">${r.researchAreas.map(a => `<span class="tech-tag">${escapeHtml(a)}</span>`).join('')}</div>`
      : '';

    art.innerHTML = `
      <div class="badge-row"><span class="status">${escapeHtml(r.status || '')}</span>${domainHtml}</div>
      <h3${isFa ? ' class="fa"' : ''}>${escapeHtml(r.title)}</h3>
      <p class="desc${isFa ? ' fa' : ''}">${escapeHtml(r.description || '')}</p>
      ${areasHtml}`;
    list.appendChild(art);
  });

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
  }
});
</script>
<script>
// Simple light/dark theme toggle (in-memory, resets on reload by design)
document.addEventListener('DOMContentLoaded', () => {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;

  btn.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('site-theme', next); }catch(e){}
  });
});

</script>
</body>
